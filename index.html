<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SPM Task Manager</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard__header">
        <div>
          <p class="eyebrow">Software Project Management</p>
          <h1>Task Manager Dashboard</h1>
        </div>
        <span class="version">v1.0.0</span>
      </header>

      <section class="board" aria-label="Task board">
        <article class="column">
          <h2>To Do</h2>
          <p>Define requirements</p>
          <p>Create release notes</p>
        </article>
        <article class="column">
          <h2>In Progress</h2>
          <p>Build dashboard interface</p>
        </article>
        <article class="column">
          <h2>Done</h2>
          <p>Set up repository workflow</p>
        </article>
      </section>
    </main>
  </body>
</html>
